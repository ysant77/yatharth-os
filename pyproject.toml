[tool.poetry]
name = "yatharth-os"
version = "0.1.0"
description = "A CLI-first, API-backed engineering portfolio for Yatharth Sant."
authors = ["Yatharth Mahesh Sant <ysant77@gmail.com>"]
readme = "README.md"
packages = [{ include = "yatharth_os", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
typer = ">=0.16.0"
rich = "^13.9.0"
click = ">=8.1.7"
reportlab = "^4.5.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.49"}
aiosqlite = "^0.22.1"
pytest-asyncio = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
ruff = "^0.6.9"
black = "^24.8.0"

[tool.poetry.scripts]
yatharth = "yatharth_os.cli.app:app"
yatharth-api = "yatharth_os.main:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=yatharth_os --cov-report=term-missing --cov-fail-under=85"
